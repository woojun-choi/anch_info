<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ACNH 성격 주민 갤러리</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #EAF3E8;
    font-family: 'Gowun Dodum', sans-serif;
  }
  #stage {
    width: 900px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 0 40px;
  }
  body.wide #stage { width: 1400px; }
  .card {
    width: 820px;
    border-radius: 40px;
    background: var(--soft);
    border: 6px solid var(--main);
    box-shadow: 0 18px 0 rgba(0,0,0,0.06);
    padding: 44px 48px 40px;
    position: relative;
  }
  body.wide .card { width: 1320px; }
  .header {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 26px;
  }
  .emoji-badge {
    width: 90px; height: 90px;
    border-radius: 28px;
    background: var(--main);
    display: flex; align-items: center; justify-content: center;
    font-size: 46px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.12);
    flex-shrink: 0;
  }
  .titles .kr {
    font-family: 'Jua', sans-serif;
    font-size: 42px;
    color: #3b3b3b;
    line-height: 1.1;
  }
  .titles .sub {
    font-size: 16px;
    color: #6b6b6b;
    margin-top: 4px;
  }
  .panels {
    display: flex;
    align-items: flex-start;
    gap: 20px;
  }
  .panel {
    flex: 1;
    background: white;
    border-radius: 26px;
    padding: 22px 20px 26px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.05);
  }
  .panel-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px dashed var(--soft);
  }
  .panel-head .label {
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    color: var(--main);
  }
  .panel-head .count {
    font-size: 13px;
    color: #999;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px 8px;
  }
  body.wide .grid { grid-template-columns: repeat(8, 1fr); }
  .vitem {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .vicon {
    width: 62px; height: 62px;
    border-radius: 50%;
    background: var(--soft);
    border: 2px solid var(--main);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .vicon img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .vname {
    font-size: 11.5px;
    color: #444;
    text-align: center;
    line-height: 1.2;
    word-break: keep-all;
  }
  .misc-section {
    margin-top: 22px;
    background: white;
    border-radius: 26px;
    padding: 20px 20px 24px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.05);
  }
  .misc-section .panel-head .label { color: #aaa; }
  .misc-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 12px 6px;
  }
  body.wide .misc-grid { grid-template-columns: repeat(16, 1fr); }
  .misc-grid .vicon { width: 44px; height: 44px; border-color: #ccc; }
  .misc-grid .vname { font-size: 10px; color: #888; }
  .footer {
    margin-top: 26px;
    padding-top: 16px;
    border-top: 1px dashed rgba(0,0,0,0.08);
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #999;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="card" id="card">
      <div class="header">
        <div class="emoji-badge" id="emoji"></div>
        <div class="titles">
          <div class="kr" id="nameKr"></div>
          <div class="sub" id="subInfo"></div>
        </div>
      </div>

      <div class="panels">
        <div class="panel">
          <div class="panel-head"><span class="label">성격 A</span><span class="count" id="countA"></span></div>
          <div class="grid" id="gridA"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><span class="label">성격 B</span><span class="count" id="countB"></span></div>
          <div class="grid" id="gridB"></div>
        </div>
      </div>

      <div class="misc-section" id="miscSection" style="display:none">
        <div class="panel-head"><span class="label">미분류</span><span class="count" id="countMisc"></span></div>
        <div class="misc-grid" id="gridMisc"></div>
      </div>

      <div class="footer">
        <span>모동숲 성격별 주민 갤러리</span>
        <span id="idTag"></span>
      </div>
    </div>
  </div>

<script>
async function render() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || 'lazy';
  if (params.get('layout') === 'wide') {
    document.body.classList.add('wide');
  }
  const [pRes, vRes] = await Promise.all([
    fetch('../data/personalities.json'),
    fetch('../data/villagers_by_type.json')
  ]);
  const personalities = await pRes.json();
  const villagersByType = await vRes.json();
  const p = personalities.find(d => d.id === id);
  if (!p) { document.body.innerHTML = '<h1>ID not found: ' + id + '</h1>'; return; }
  const group = villagersByType[p.personalityKey] || {A:[],B:[],'미분류':[]};

  document.getElementById('card').style.setProperty('--main', p.color);
  document.getElementById('card').style.setProperty('--soft', p.colorSoft);
  document.getElementById('emoji').textContent = p.emoji;
  document.getElementById('nameKr').textContent = p.nameKr;
  const total = group.A.length + group.B.length + (group['미분류']||[]).length;
  document.getElementById('subInfo').textContent = p.nameEn + ' · 전체 ' + total + '명';

  function iconUrl(en) {
    return '../images/faces/' + encodeURIComponent(en) + '.png';
  }

  function fillGrid(gridEl, list) {
    gridEl.innerHTML = list.map(v => `
      <div class="vitem">
        <div class="vicon"><img src="${iconUrl(v.en)}" alt="${v.kr}"></div>
        <div class="vname">${v.kr}</div>
      </div>
    `).join('');
  }

  fillGrid(document.getElementById('gridA'), group.A);
  fillGrid(document.getElementById('gridB'), group.B);
  document.getElementById('countA').textContent = group.A.length + '명';
  document.getElementById('countB').textContent = group.B.length + '명';

  const misc = group['미분류'] || [];
  if (misc.length > 0) {
    document.getElementById('miscSection').style.display = '';
    fillGrid(document.getElementById('gridMisc'), misc);
    document.getElementById('countMisc').textContent = misc.length + '명';
  }

  document.getElementById('idTag').textContent = '#' + p.nameKr;
  document.body.setAttribute('data-ready', 'true');
}
render();
</script>
</body>
</html>
